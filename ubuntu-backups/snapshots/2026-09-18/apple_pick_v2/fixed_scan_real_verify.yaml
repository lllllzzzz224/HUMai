frames:
  base: base_link
  tcp: tcp_link
moveit:
  group: rm_group
  pipeline: ompl
  planner: RRTConnectkConfigDefault
  velocity_scaling: 0.05
  acceleration_scaling: 0.05
  planning_attempts: 10
  planning_time_s: 10.0
scan:
  # hand_eye_20260808_141248 中“鸟瞰位”10 帧 /joint_states 平均值，单位 rad。
  # 原值 [2.627..., 1.0766..., ...] 实际是该记录中的“腕部旋转观察位”。
  joints:
    joint1: 2.510152891
    joint2: 0.354521179
    joint3: 0.647129746
    joint4: 0.061472860
    joint5: 2.045541343
    joint6: -0.071433319
  tolerance_rad: 0.015
targets:
  pregrasp_above_apple_m: 0.10
  verify_above_apple_m: 0.03
  # 保留当前鸟瞰位的水平朝向，只把 tcp_link 正 Z 严格对准 base_link 负 Z。
  vertical_yaw_rad: 2.847
  position_tolerance_m: 0.003
  orientation_tolerance_rad: 0.03
vision:
  center_topic: /apple_pick_v2/apple_center
  diagnostics_topic: /apple_pick_v2/apple_diagnostics
  sample_count: 10
  timeout_s: 30.0
  max_axis_span_m: 0.010
  min_confidence: 0.45
  min_radius_m: 0.020
  max_radius_m: 0.080
cartesian:
  max_step_m: 0.003
  jump_threshold: 1.5
  revolute_jump_threshold_rad: 0.35
  max_tcp_speed_m_s: 0.010
  required_fraction: 0.999
scene:
  # 苹果静置于桌面，桌面顶面由 center_z - radius 推算，并向上膨胀 5 mm。
  table_safety_inflation_m: 0.005
  table_size_xyz_m: [0.75, 1.20, 0.10]
  table_center_xy_m: [0.425, -0.10]
  # RealSense 的临时保守包络，姿态来自现有 Link6 -> camera_link 外参。
  camera_box_xyz_m: [0.11, 0.05, 0.05]
  camera_translation_link6_m: [-0.064514447085, 0.005428183272, 0.003696935131]
  camera_quaternion_link6_xyzw: [-0.020548815920, 0.728253776074, -0.001728512288, -0.684997223383]
safety:
  service_timeout_s: 10.0
  motion_timeout_s: 180.0
  max_joint_delta_rad: 2.60
  max_tcp_final_error_m: 0.005
  tcp_stable_time_s: 1.0
  require_operator_phrase: EXECUTE
